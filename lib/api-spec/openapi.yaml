openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Visa Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: umrah
    description: Umrah pilgrims management
  - name: visas
    description: Other visas management
  - name: dashboard
    description: Dashboard statistics
  - name: archive
    description: Archive records
  - name: provider
    description: Provider account management
  - name: statement
    description: Agent & client statements, ledger
  - name: vouchers
    description: Receipt/payment vouchers
  - name: settings
    description: Office settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /provider/accounts:
    get:
      operationId: listAccounts
      tags: [provider]
      summary: List all accounts (provider only)
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      operationId: createAccount
      tags: [provider]
      summary: Create an owner or sub account (provider only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /provider/accounts/{id}:
    delete:
      operationId: deleteAccount
      tags: [provider]
      summary: Delete an account (provider only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /provider/accounts/{id}/expiry:
    patch:
      operationId: updateAccountExpiry
      tags: [provider]
      summary: Set/extend an owner account expiry (provider only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountExpiryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /provider/accounts/{id}/password:
    patch:
      operationId: updateAccountPassword
      tags: [provider]
      summary: Change an account password (provider only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPasswordInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /provider/accounts/{id}/username:
    patch:
      operationId: updateAccountUsername
      tags: [provider]
      summary: Change an account username (provider only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUsernameInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /statement/agent-names:
    get:
      operationId: listAgentNames
      tags: [statement]
      summary: List agent names for form pickers (all office users)
      responses:
        "200":
          description: Agent names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /statement/agents:
    get:
      operationId: listAgents
      tags: [statement]
      summary: List agents with balances (owner/provider only)
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentAccount"
    post:
      operationId: createAgent
      tags: [statement]
      summary: Register an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAccount"

  /statement/agents/{id}:
    put:
      operationId: updateAgent
      tags: [statement]
      summary: Update an agent (rename re-tags transactions)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAccount"
    delete:
      operationId: deleteAgent
      tags: [statement]
      summary: Delete an agent (transactions keep the old name)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /statement/agents/{id}/details:
    get:
      operationId: getAgentDetails
      tags: [statement]
      summary: Agent statement — transactions, payments, balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetails"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /statement/agents/{id}/payments:
    post:
      operationId: createAgentPayment
      tags: [statement]
      summary: Record a payment with an agent (optionally issues a voucher)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPayment"

  /statement/payments/{id}:
    delete:
      operationId: deleteAgentPayment
      tags: [statement]
      summary: Delete an agent payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /statement/clients:
    get:
      operationId: listClientAccounts
      tags: [statement]
      summary: Client accounts — balances grouped by client name
      responses:
        "200":
          description: Client accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientAccount"
    put:
      operationId: updateClientAccount
      tags: [statement]
      summary: Update a client account or transaction-derived client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientAccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAccount"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /statement/clients/details:
    get:
      operationId: getClientDetails
      tags: [statement]
      summary: Client statement — transactions and vouchers by client name
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Client details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetails"

  /statement/ledger:
    get:
      operationId: listLedger
      tags: [statement]
      summary: List general ledger entries
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerEntry"
    post:
      operationId: createLedgerEntry
      tags: [statement]
      summary: Add a ledger entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"

  /statement/ledger/{id}:
    put:
      operationId: updateLedgerEntry
      tags: [statement]
      summary: Update a ledger entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LedgerEntryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerEntry"
    delete:
      operationId: deleteLedgerEntry
      tags: [statement]
      summary: Delete a ledger entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /statement/summary:
    get:
      operationId: getStatementSummary
      tags: [statement]
      summary: Monthly income/expense summary (transactions + ledger)
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementMonth"

  /vouchers:
    get:
      operationId: listVouchers
      tags: [vouchers]
      summary: List vouchers
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: party
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voucher"
    post:
      operationId: createVoucher
      tags: [vouchers]
      summary: Create a standalone voucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"

  /vouchers/{id}:
    get:
      operationId: getVoucher
      tags: [vouchers]
      summary: Get a voucher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Voucher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
    put:
      operationId: updateVoucher
      tags: [vouchers]
      summary: Update a voucher and its linked agent payment when applicable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVoucher
      tags: [vouchers]
      summary: Delete a voucher
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /umrah:
    get:
      operationId: listUmrahClients
      tags: [umrah]
      summary: List all umrah clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: agent
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of umrah clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UmrahClient"
    post:
      operationId: createUmrahClient
      tags: [umrah]
      summary: Add a new umrah client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UmrahClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahClient"

  /umrah/{id}:
    get:
      operationId: getUmrahClient
      tags: [umrah]
      summary: Get a single umrah client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Umrah client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahClient"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUmrahClient
      tags: [umrah]
      summary: Update an umrah client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UmrahClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UmrahClient"
    delete:
      operationId: deleteUmrahClient
      tags: [umrah]
      summary: Delete an umrah client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /visas:
    get:
      operationId: listVisas
      tags: [visas]
      summary: List all other visas
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: visaType
          in: query
          schema:
            type: string
        - name: agent
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of visas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OtherVisa"
    post:
      operationId: createVisa
      tags: [visas]
      summary: Add a new visa record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtherVisaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherVisa"

  /visas/{id}:
    get:
      operationId: getVisa
      tags: [visas]
      summary: Get a single visa record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Visa record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherVisa"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateVisa
      tags: [visas]
      summary: Update a visa record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtherVisaUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtherVisa"
    delete:
      operationId: deleteVisa
      tags: [visas]
      summary: Delete a visa record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get overall dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/monthly:
    get:
      operationId: getMonthlyStats
      tags: [dashboard]
      summary: Get monthly breakdown for charts
      parameters:
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyStats"

  /dashboard/agents:
    get:
      operationId: getAgentStats
      tags: [dashboard]
      summary: Get statistics grouped by agent
      responses:
        "200":
          description: Agent stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentStats"

  /dashboard/outstanding:
    get:
      operationId: getOutstandingBalances
      tags: [dashboard]
      summary: Get clients with outstanding balances
      responses:
        "200":
          description: Outstanding balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutstandingBalance"

  /archive:
    get:
      operationId: listArchive
      tags: [archive]
      summary: Get all records from the general archive
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: visaType
          in: query
          schema:
            type: string
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Archive records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchiveRecord"

  /settings/office:
    get:
      operationId: getOfficeSettings
      tags: [settings]
      summary: Get office branding settings
      responses:
        "200":
          description: Office settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeSettings"
    put:
      operationId: updateOfficeSettings
      tags: [settings]
      summary: Update office branding settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeSettingsUpdate"
      responses:
        "200":
          description: Updated office settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficeSettings"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        officeId:
          type: integer
        expiresAt:
          type: ["string", "null"]

    Account:
      type: object
      required: [id, username, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        parentUserId:
          type: ["integer", "null"]
        expiresAt:
          type: ["string", "null"]
        officeName:
          type: ["string", "null"]
        createdAt:
          type: string

    AccountInput:
      type: object
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [owner, sub]
        parentUserId:
          type: integer
        expiresAt:
          type: ["string", "null"]

    AccountExpiryInput:
      type: object
      properties:
        expiresAt:
          type: ["string", "null"]

    AccountPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AccountUsernameInput:
      type: object
      required: [username]
      properties:
        username:
          type: string

    AgentAccount:
      type: object
      required: [id, name, openingBalance, totalPurchases, transferred, paidFrom, paidTo, balance, txCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        openingBalance:
          type: number
        totalPurchases:
          type: number
        transferred:
          type: number
        paidFrom:
          type: number
        paidTo:
          type: number
        balance:
          type: number
        txCount:
          type: integer
        createdAt:
          type: string

    AgentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        phone:
          type: string
        notes:
          type: string
        openingBalance:
          type: number

    AgentPayment:
      type: object
      required: [id, agentId, amount, direction, paidAt, createdAt]
      properties:
        id:
          type: integer
        agentId:
          type: integer
        amount:
          type: number
        direction:
          type: string
        paidAt:
          type: string
        notes:
          type: ["string", "null"]
        voucherId:
          type: ["integer", "null"]
        createdAt:
          type: string

    AgentPaymentInput:
      type: object
      required: [amount, direction]
      properties:
        amount:
          type: number
        direction:
          type: string
          enum: [from_agent, to_agent]
        paidAt:
