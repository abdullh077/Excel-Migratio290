kind = "web"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "artifacts/api-server"
router = "path"

[[services]]
name = "API Server"
paths = [ "/api" ]
localPort = 8080

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/api-server", "run", "build" ]
run = [ "node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs" ]

[services.env]
PORT = "8080"
